<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NEXTGREEN - Scanner de Mercado</title>
    <style>
        :root { --bg: #0a0a0a; --card: #121212; --border: #222; --green: #12EF52; --red: #ff3333; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #0d0d0d; border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        .logo { font-weight: 900; font-size: 20px; margin-bottom: 30px; } .logo span { color: var(--green); }
        .menu-item { padding: 12px; color: #888; border-radius: 8px; font-size: 14px; margin-bottom: 5px; cursor: pointer; }
        .menu-item.active { background: rgba(18, 239, 82, 0.1); color: var(--green); font-weight: bold; }
        .logout-btn { margin-top: auto; color: var(--red) !important; }
        
        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; overflow-y: auto; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; }
        
        .btn-green { background: var(--green); color: black; font-weight: bold; border: none; border-radius: 8px; padding: 15px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-tab { background: #222; color: #888; border: 1px solid #444; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; text-align: center;}
        .btn-tab.active { background: #143a1e; color: var(--green); border-color: var(--green); font-weight: bold; }

        #area-sinal { display: none; }
        .sinal-box { padding: 30px; border-radius: 12px; text-align: center; font-size: 32px; font-weight: 900; margin-bottom: 20px; }
        .sinal-box.venda { background: rgba(255, 51, 51, 0.1); border: 1px solid var(--red); color: var(--red); }
        .sinal-box.compra { background: rgba(18, 239, 82, 0.1); border: 1px solid var(--green); color: var(--green); }
        .data-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; }
        
        #lista-historico { max-height: 150px; overflow-y: auto; }
        .historico-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">⚡ NEXT<span>GREEN</span></div>
        <div class="menu-item active">📊 Gerador de Sinais</div>
        <div class="menu-item logout-btn" onclick="fazerLogout()">🚪 Sair da Conta</div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div style="font-size: 22px; font-weight: bold;">Scanner de Mercado (Cloud)</div>
            <div style="color: var(--green); font-size: 12px;">● Servidor Online</div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div style="font-size: 16px; color: #888; margin-bottom: 20px;">⚙️ Configurações</div>
                
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button class="btn-tab active" id="tab-m1" onclick="setConfig('timeframe', 'M1')">M1 (1 min)</button>
                    <button class="btn-tab" id="tab-m5" onclick="setConfig('timeframe', 'M5')">M5 (5 min)</button>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 30px;">
                    <button class="btn-tab active" id="tab-otc" onclick="setConfig('mercado', 'OTC')">Mercado OTC</button>
                    <button class="btn-tab" id="tab-aberto" onclick="setConfig('mercado', 'ABERTO')">Mercado Aberto</button>
                </div>

                <button class="btn-green" onclick="salvarConfig()">🔍 Ativar Busca na Nuvem</button>
            </div>

            <div class="card">
                <div style="font-size: 16px; color: #888; margin-bottom: 20px;">📡 Resultado</div>
                <div id="msg-inicial" style="text-align: center; padding: 50px 0; color: #666;">Aguardando sinal do servidor...</div>
                <div id="area-sinal">
                    <div class="sinal-box venda" id="box-direcao">📉 VENDA</div>
                    <div class="data-row"><span>Ativo:</span> <strong id="res-ativo">-</strong></div>
                    <div class="data-row"><span>Timeframe:</span> <strong id="res-tf">-</strong></div>
                    <div class="data-row"><span>Confiança:</span> <strong id="res-conf" style="color: var(--green);">-</strong></div>
                    <div class="data-row"><span>Entrada:</span> <strong id="res-hora" style="color: var(--green);">-</strong></div>
                    <button class="btn-green" style="margin-top: 20px;" onclick="alert('Sinal copiado!')">✅ Copiar Sinal</button>
                </div>
            </div>

            <div class="card" style="grid-column: span 2;">
                <div style="font-size: 16px; color: #888; margin-bottom: 15px;">📜 Histórico Recente</div>
                <div id="lista-historico"><div style="color: #666; text-align: center;">Nenhum sinal recebido ainda...</div></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
